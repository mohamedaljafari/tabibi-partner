name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tabibi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: TypeScript
        run: pnpm run check
      - name: Database schema
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
      - name: Start local dev server (hosts shared tabibi router)
        run: (pnpm dev:server > server.log 2>&1 &) && sleep 3
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
      - name: Wait for server
        run: |
          set +e
          for i in $(seq 1 40); do
            if (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null; then
              echo "Server is up"
              break
            fi
            sleep 5
          done
          (echo > /dev/tcp/127.0.0.1/3000) 2>/dev/null || (echo "Server log:" && cat server.log && exit 1)
      - name: Tests
        run: pnpm test
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN || '10081460020501' }}
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
          EXPO_PUBLIC_TABIBI_API_BASE_URL: http://127.0.0.1:3000
