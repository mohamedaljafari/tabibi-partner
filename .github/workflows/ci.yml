name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: tabibi
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -u root -proot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: "9.12.0"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: TypeScript
        run: pnpm run check
      - name: Database schema
        run: npx drizzle-kit migrate
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
      - name: Start dev server
        run: pnpm dev:server &
        env:
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
      - name: Wait for server
        run: npx wait-on http://127.0.0.1:3000 -t 60000
      - name: Tests
        run: pnpm test
        env:
          ADMIN_PIN: ${{ secrets.ADMIN_PIN || '10081460020501' }}
          DATABASE_URL: mysql://root:root@127.0.0.1:3306/tabibi
